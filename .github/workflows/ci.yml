name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Lint (Obsidian plugin guidelines)
        run: npm run lint

      - name: Run tests with coverage thresholds
        run: npm run test:coverage

      - name: Static analysis (fallow)
        run: npm run analyze
