name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # Both platforms, because a green Ubuntu run says nothing about the two things that
    # differ: path separators and line endings. Each had already broken `docs-check.mjs`
    # on Windows — it reported `docs\adrs\…` where the corpus expects `/`, and it read a
    # CRLF checkout as a register with no frontmatter in it at all. Both are fixed; with
    # one entry in this matrix, neither was visible and the next one would not be either.
    runs-on: ${{ matrix.os }}
    strategy:
      # Both legs report. A cancelled sibling is a leg whose result nobody has, and the
      # question this matrix exists to answer is exactly which platform failed.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Typecheck the test suite
        run: npm run typecheck:test

      - name: Lint (Obsidian plugin guidelines)
        run: npm run lint

      - name: Lint the Markdown a person reads
        run: npm run lint:md

      - name: Run tests with coverage thresholds
        run: npm run test:coverage

      - name: Static analysis (fallow)
        run: npm run analyze

      - name: Validate the docs register and ADRs
        run: npm run docs

  # The same suite, somewhere that is not the source language. A suite that has only ever
  # run in English proves nothing about the translation layer: this leg is what exercises
  # the catalog fallback across every surface (a code with no catalog of its own resolves
  # to English, and English's plural rules have to come with it) and `Intl.NumberFormat`
  # in a locale that groups and separates unlike English.
  #
  # `de-DE` rather than the pseudo-locale, and that is the leg's stated ceiling: most
  # assertions in this suite name the English text on purpose, so a pass under a second
  # CATALOG would be measuring the assertions rather than the layer. What checks the
  # catalog half, key by key, is `test/i18n/`'s own marked catalogs.
  #
  # One platform, because a locale is not a path separator — `verify` is what asks the
  # Windows question, and asking it twice buys nothing.
  locale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the suite in a non-English locale
        run: npm test
        env:
          PBL_TEST_LOCALE: de-DE

  # The same suite, somewhere that is not UTC. A suite that has only ever run in UTC
  # proves nothing about the zone the clock helper pins — the identical argument the
  # `locale` leg above makes about the source language, and the one `verify`'s matrix
  # makes about path separators.
  #
  # It is not hypothetical. `test/helpers/clock.ts` freezes `Date` at a midday-UTC instant
  # so the suite reads one day whatever day it runs on, but `dateStamp`
  # (`src/domain/noteFields.ts`) reads LOCAL getters — so east of UTC+12 that instant is
  # already the next day and the freeze failed at the one thing it exists to do. Every
  # runner here is UTC, so nothing was ever red; a contributor in NZ met it alone. See
  # `docs/bugs/The frozen day is not frozen east of UTC+12.md`.
  #
  # `Pacific/Kiritimati` is UTC+14, the furthest a civil date can run ahead of the frozen
  # instant, so it is the leg's worst case rather than a representative one. The pin
  # inside the helper is what makes this pass; delete that line and this job is the only
  # thing in CI that goes red.
  #
  # One platform, because a zone is not a path separator — `verify` asks the Windows
  # question, and asking it twice buys nothing.
  zone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the suite east of the date line
        run: npm test
        env:
          TZ: Pacific/Kiritimati

  # Its own job, never a step in `verify`, and that separation is the decision rather
  # than a layout preference — see ADR 0022. `npm run check` is the offline definition
  # of done and every step in it can be satisfied by the commit being written; an
  # advisory can be published with no patched version, which is a red nobody can clear.
  # Keeping it here means a merge waits on it while a local `check` never does, and the
  # two failures read differently because they are different.
  #
  # One platform, because an advisory is a fact about the dependency tree and the
  # lockfile is the same on both. `--omit=dev` scopes it to what actually reaches a
  # vault: the audit that prompted ADR 0019 was six dev SERVERS, none of them in
  # `main.js`.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit what ships
        run: npm run audit
