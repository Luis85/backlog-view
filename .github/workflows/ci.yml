name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # Both platforms, because a green Ubuntu run says nothing about the two things that
    # differ: path separators and line endings. Each had already broken `docs-check.mjs`
    # on Windows — it reported `docs\adrs\…` where the corpus expects `/`, and it read a
    # CRLF checkout as a register with no frontmatter in it at all. Both are fixed; with
    # one entry in this matrix, neither was visible and the next one would not be either.
    runs-on: ${{ matrix.os }}
    strategy:
      # Both legs report. A cancelled sibling is a leg whose result nobody has, and the
      # question this matrix exists to answer is exactly which platform failed.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Lint (Obsidian plugin guidelines)
        run: npm run lint

      - name: Lint the Markdown a person reads
        run: npm run lint:md

      - name: Run tests with coverage thresholds
        run: npm run test:coverage

      - name: Static analysis (fallow)
        run: npm run analyze

      - name: Validate the docs register and ADRs
        run: npm run docs

  # Its own job, never a step in `verify`, and that separation is the decision rather
  # than a layout preference — see ADR 0022. `npm run check` is the offline definition
  # of done and every step in it can be satisfied by the commit being written; an
  # advisory can be published with no patched version, which is a red nobody can clear.
  # Keeping it here means a merge waits on it while a local `check` never does, and the
  # two failures read differently because they are different.
  #
  # One platform, because an advisory is a fact about the dependency tree and the
  # lockfile is the same on both. `--omit=dev` scopes it to what actually reaches a
  # vault: the audit that prompted ADR 0019 was six dev SERVERS, none of them in
  # `main.js`.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit what ships
        run: npm run audit
